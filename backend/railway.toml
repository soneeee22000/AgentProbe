[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Just uvicorn — tables are created via the FastAPI lifespan
# (Base.metadata.create_all). Run migrations + seed manually after the
# initial deploy (railway run python -m scripts.seed_demo_runs).
startCommand = "sh -c 'uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
