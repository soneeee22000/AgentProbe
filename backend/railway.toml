[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Run migrations, optionally seed demo runs (SEED_DEMO_ON_STARTUP=true), then boot.
startCommand = "alembic upgrade head && python -m scripts.maybe_seed && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
