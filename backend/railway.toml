[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Run migrations + seed (idempotent, controlled by SEED_DEMO_ON_STARTUP)
# before the API boots. Wrapped in sh -c so the shell expands $PORT.
startCommand = "sh -c 'alembic upgrade head && python -m scripts.maybe_seed && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
